<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Library — ห้องสมุดอัจฉริยะ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#1f6feb; --primary-d:#1657bd; --ink:#0f172a; --muted:#64748b;
  --bg:#f5f7fb; --line:#e5e9f0; --ok:#16a34a; --warn:#f59e0b; --danger:#dc2626;
  --radius:16px; --shadow:0 4px 16px rgba(15,23,42,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans Thai',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
img{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer;border:none}
input,select,textarea{font-family:inherit;font-size:15px}
.container{max-width:1100px;margin:0 auto;padding:20px 16px 96px}
.hide{display:none!important}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;font-weight:600;font-size:15px;background:#fff;color:var(--ink);border:1px solid var(--line);transition:.15s}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-d)}
.btn-ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn-danger{background:#fff;color:var(--danger);border-color:#fecaca}
.btn-block{width:100%}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- Form ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(31,111,235,.12)}

/* ---------- Login ---------- */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(1000px 500px at 15% 0%,#e3edff 0%,transparent 60%),var(--bg)}
.login-card{width:100%;max-width:400px;background:#fff;border-radius:22px;padding:32px;box-shadow:0 18px 50px rgba(15,23,42,.10)}
.logo{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:26px;text-align:center}
.logo-mark{width:62px;height:62px;border-radius:18px;background:linear-gradient(135deg,var(--primary),#38bdf8);display:grid;place-items:center;font-size:30px;box-shadow:0 8px 20px rgba(31,111,235,.35)}
.logo h1{font-size:23px;letter-spacing:-.3px}
.logo p{font-size:13px;color:var(--muted)}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin:18px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.hint{font-size:12px;color:var(--muted);background:#f1f5f9;padding:10px 12px;border-radius:10px;margin-top:16px;line-height:1.7}

/* ---------- Topbar & Nav ---------- */
.topbar{position:sticky;top:0;z-index:40;background:#fff;border-bottom:1px solid var(--line)}
.topbar-in{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;cursor:pointer;white-space:nowrap}
.brand .m{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--primary),#38bdf8);display:grid;place-items:center;font-size:17px}
.nav{display:flex;gap:4px;margin-left:auto;align-items:center}
.nav a{padding:9px 13px;border-radius:10px;font-size:14px;font-weight:500;color:var(--muted);text-decoration:none;cursor:pointer}
.nav a:hover{background:#f1f5f9;color:var(--ink)}
.nav a.active{background:#e8f0fe;color:var(--primary);font-weight:600}
.avatar{width:36px;height:36px;border-radius:50%;background:#e8f0fe;color:var(--primary);display:grid;place-items:center;font-weight:700;cursor:pointer}
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:50;padding:6px 4px 8px}
.bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);text-decoration:none;padding:4px}
.bottom-nav a.active{color:var(--primary);font-weight:600}
.bottom-nav .ic{font-size:19px}
@media(max-width:820px){.nav{display:none}.bottom-nav{display:flex}}

/* ---------- Cards & layout ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:20px}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:26px 0 14px}
.section-title h2{font-size:18px}
.section-title a{font-size:13px;color:var(--primary);cursor:pointer;font-weight:600}
.grid{display:grid;gap:14px}
.grid-books{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.grid-menu{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.grid-stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}

/* Hero search */
.hero{background:linear-gradient(135deg,#1f6feb,#3b9dfa);border-radius:22px;padding:30px 24px;color:#fff;margin-bottom:8px}
.hero h2{font-size:22px;margin-bottom:4px}
.hero p{opacity:.9;font-size:14px;margin-bottom:18px}
.searchbar{display:flex;gap:8px;background:#fff;border-radius:14px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.searchbar input{flex:1;border:none;outline:none;padding:12px 14px;font-size:15px;background:transparent}
.searchbar button{padding:0 20px;border-radius:10px;background:var(--primary);color:#fff;font-weight:600}

.menu-tile{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px 14px;text-align:center;cursor:pointer;transition:.15s;box-shadow:var(--shadow)}
.menu-tile:hover{transform:translateY(-3px);border-color:#c7dbfb}
.menu-tile .ic{font-size:26px;display:block;margin-bottom:8px}
.menu-tile .t{font-weight:600;font-size:14px}

/* Book card */
.book-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:.15s;box-shadow:var(--shadow)}
.book-card:hover{transform:translateY(-4px);box-shadow:0 12px 26px rgba(15,23,42,.12)}
.cover{aspect-ratio:3/4;width:100%;object-fit:cover;background:#eef2f7}
.book-card .info{padding:11px 12px 14px}
.book-card .title{font-weight:600;font-size:14px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:39px}
.book-card .author{font-size:12px;color:var(--muted);margin:3px 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:99px}
.b-ok{background:#dcfce7;color:#15803d}
.b-out{background:#fee2e2;color:#b91c1c}
.b-late{background:#fef3c7;color:#b45309}
.b-info{background:#e8f0fe;color:#1657bd}
.b-gray{background:#f1f5f9;color:#475569}

/* Filters */
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.filters .input{width:auto;flex:1;min-width:150px}

/* Book detail */
.detail{display:grid;grid-template-columns:270px 1fr;gap:26px}
@media(max-width:760px){.detail{grid-template-columns:1fr}}
.detail .cover{border-radius:14px;box-shadow:0 10px 30px rgba(15,23,42,.18)}
.meta-row{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.meta-row .k{width:110px;color:var(--muted);flex:none}

/* Floor map */
.map{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:8px}
.map-head{font-size:13px;color:var(--muted);margin-bottom:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
.shelves{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.shelf{background:#fff;border:2px dashed #cbd5e1;border-radius:10px;padding:16px 6px;text-align:center;font-size:13px;font-weight:600;color:#94a3b8}
.shelf.on{border:2px solid var(--primary);background:#e8f0fe;color:var(--primary);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(31,111,235,.35)}50%{box-shadow:0 0 0 8px rgba(31,111,235,0)}}
.entrance{margin-top:10px;text-align:center;font-size:12px;color:var(--muted);border-top:2px solid var(--line);padding-top:8px}
.slots{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.slot{padding:7px 10px;border-radius:8px;background:#fff;border:1px solid var(--line);font-size:12px;color:var(--muted)}
.slot.on{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:700}

/* Scanner */
.scanner{max-width:460px;margin:0 auto}
.video-box{position:relative;border-radius:18px;overflow:hidden;background:#0f172a;aspect-ratio:1/1}
.video-box video{width:100%;height:100%;object-fit:cover}
.frame{position:absolute;inset:16%;border:3px solid rgba(255,255,255,.9);border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.scan-empty{position:absolute;inset:0;display:grid;place-items:center;color:#fff;text-align:center;padding:20px;font-size:14px}

/* Lists / table */
.row-item{display:flex;gap:14px;padding:14px;border-bottom:1px solid var(--line);align-items:center}
.row-item:last-child{border-bottom:none}
.row-item .thumb{width:58px;height:78px;border-radius:8px;object-fit:cover;flex:none}
.row-item .grow{flex:1;min-width:0}
.row-item .t{font-weight:600;font-size:15px}
.row-item .s{font-size:12.5px;color:var(--muted)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:620px}
th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:#f8fafc;font-size:12.5px;color:var(--muted);font-weight:600}
tr:hover td{background:#fbfdff}

.stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.stat .n{font-size:26px;font-weight:700}
.stat .l{font-size:13px;color:var(--muted)}

.tabs{display:flex;gap:6px;background:#fff;border:1px solid var(--line);padding:5px;border-radius:12px;margin-bottom:16px;overflow-x:auto}
.tabs button{padding:9px 14px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);background:transparent;white-space:nowrap}
.tabs button.active{background:var(--primary);color:#fff}

/* Modal & toast */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);display:grid;place-items:center;z-index:100;padding:16px}
.modal{background:#fff;border-radius:18px;width:100%;max-width:460px;max-height:88vh;overflow:auto;padding:24px}
.modal h3{font-size:18px;margin-bottom:14px}
.modal-actions{display:flex;gap:10px;margin-top:18px}
.modal-actions .btn{flex:1}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#0f172a;color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:up .25s}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty .ic{font-size:40px;display:block;margin-bottom:10px}
.qr-img{width:150px;height:150px;border:1px solid var(--line);border-radius:12px;padding:8px;background:#fff}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal-root"></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
/* =========================================================
   1) DATA LAYER — จำลองฐานข้อมูล (Users / Books / Borrowing)
   ========================================================= */
const KEY='smartlib_v1', DAY=86400000, LOAN_DAYS=7, MAX_BOOKS=3;
const iso = d => new Date(d).toISOString().slice(0,10);
const today = () => iso(Date.now());

function cover(title,color){
  const t=title.length>34?title.slice(0,34)+'…':title;
  const words=t.split(' '); let lines=[],cur='';
  words.forEach(w=>{ if((cur+' '+w).trim().length>13){lines.push(cur.trim());cur=w;} else cur+=' '+w; });
  lines.push(cur.trim()); lines=lines.slice(0,4);
  const tspans=lines.map((l,i)=>`<tspan x="50%" dy="${i?26:0}">${l.replace(/&/g,'&amp;')}</tspan>`).join('');
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="${color}"/><stop offset="1" stop-color="#0f172a" stop-opacity=".85"/></linearGradient></defs>
    <rect width="300" height="400" fill="url(#g)"/>
    <rect x="0" y="0" width="14" height="400" fill="rgba(0,0,0,.25)"/>
    <text x="50%" y="150" text-anchor="middle" fill="#fff" font-size="21" font-weight="700"
      font-family="Noto Sans Thai, sans-serif">${tspans}</text>
    <text x="50%" y="360" text-anchor="middle" fill="rgba(255,255,255,.75)" font-size="13"
      font-family="Noto Sans Thai, sans-serif">SMART LIBRARY</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}

const SEED_BOOKS=[
 ['ฟิสิกส์พื้นฐาน เล่ม 1','ดร.สมชาย ใจดี','วิทยาศาสตร์','9786160812345','A','2','B','B-12','#1f6feb','ครอบคลุมกลศาสตร์ แรง งาน พลังงาน และการเคลื่อนที่ พร้อมโจทย์ฝึกท้ายบททุกหัวข้อ เหมาะกับนักศึกษาปี 1',28],
 ['แคลคูลัสสำหรับวิศวกร','รศ.ดร.วิชัย มั่นคง','คณิตศาสตร์','9786160823456','A','2','B','B-05','#7c3aed','ลิมิต อนุพันธ์ ปริพันธ์ และการประยุกต์ทางวิศวกรรม อธิบายทีละขั้นด้วยตัวอย่างจริง',41],
 ['เขียนโปรแกรม Python เบื้องต้น','ปิยะ โค้ดดี้','คอมพิวเตอร์','9786160834567','B','1','A','A-03','#0ea5e9','เริ่มจากศูนย์จนเขียนโปรแกรมใช้งานได้จริง ครอบคลุมตัวแปร ลูป ฟังก์ชัน และการทำงานกับไฟล์',63],
 ['โครงสร้างข้อมูลและอัลกอริทึม','ผศ.สุธีร์ วัฒนา','คอมพิวเตอร์','9786160845678','B','1','A','A-11','#0f766e','Array, Linked List, Stack, Queue, Tree, Graph พร้อมวิเคราะห์ Big-O อย่างเข้าใจง่าย',37],
 ['ประวัติศาสตร์ไทยร่วมสมัย','อ.ณัฐพงษ์ ศรีสุข','ประวัติศาสตร์','9786160856789','C','3','C','C-07','#b45309','สรุปพัฒนาการสังคมไทยตั้งแต่ต้นรัตนโกสินทร์จนถึงยุคปัจจุบันในเชิงวิชาการ',19],
 ['ภาษาอังกฤษเพื่อการสื่อสาร','Jane Miller','ภาษา','9786160867890','C','3','A','A-02','#db2777','บทสนทนาในสถานการณ์จริง คำศัพท์ที่ใช้บ่อย และแบบฝึกการออกเสียงสำหรับผู้เริ่มต้น',52],
 ['จิตวิทยาการเรียนรู้','ดร.อรทัย พูนผล','จิตวิทยา','9786160878901','C','3','D','D-09','#9333ea','ทฤษฎีการเรียนรู้ แรงจูงใจ และเทคนิคการจำที่นำไปใช้กับการอ่านหนังสือสอบได้ทันที',33],
 ['เศรษฐศาสตร์เบื้องต้น','รศ.ธนพล ทรัพย์ทวี','เศรษฐศาสตร์','9786160889012','B','2','C','C-14','#059669','อุปสงค์ อุปทาน ตลาด และเศรษฐศาสตร์มหภาคฉบับเข้าใจง่ายพร้อมกรณีศึกษาไทย',21],
 ['ชีววิทยาของเซลล์','ดร.พิมพ์ชนก แสงทอง','วิทยาศาสตร์','9786160890123','A','2','D','D-01','#16a34a','โครงสร้างเซลล์ การแบ่งเซลล์ และเมแทบอลิซึม พร้อมภาพประกอบเชิงเปรียบเทียบ',17],
 ['ออกแบบ UX/UI สำหรับผู้เริ่มต้น','กมลชนก ดีไซน์','คอมพิวเตอร์','9786160901234','B','1','B','B-08','#e11d48','กระบวนการคิดเชิงออกแบบ การทำ Wireframe และหลัก Usability ที่ใช้ได้จริงในโปรเจกต์',45],
 ['วรรณคดีไทยคัดสรร','อ.ชูใจ วรรณศิลป์','วรรณกรรม','9786160912345','C','3','B','B-03','#7c2d12','รวมบทวิเคราะห์วรรณคดีสำคัญ พร้อมบริบททางสังคมและวัฒนธรรมของแต่ละยุค',12],
 ['สถิติเพื่อการวิจัย','ผศ.ดร.เมธี ตั้งมั่น','คณิตศาสตร์','9786160923456','A','2','C','C-02','#475569','สถิติพรรณนา การทดสอบสมมติฐาน และการเลือกใช้สถิติให้เหมาะกับงานวิจัย',26],
];

function seed(){
  const books=SEED_BOOKS.map((b,i)=>({
    book_id:i+1, title:b[0], author:b[1], category:b[2], isbn:b[3],
    location:{building:b[4],floor:b[5],shelf:b[6],slot:b[7]},
    image:cover(b[0],b[8]), description:b[9], popular:b[10],
    qr_code:'SL-'+String(i+1).padStart(4,'0'), status:'available'
  }));
  const users=[
    {user_id:1,name:'ธนกฤต วงศ์สว่าง',student_id:'6512345678',password:'1234',role:'student',faculty:'วิศวกรรมศาสตร์'},
    {user_id:2,name:'ศิริพร ใจงาม',student_id:'6598765432',password:'1234',role:'student',faculty:'ครุศาสตร์'},
    {user_id:9,name:'บรรณารักษ์ สมใจ',student_id:'admin',password:'admin',role:'admin',faculty:'สำนักหอสมุด'},
  ];
  const now=Date.now();
  const borrowing=[
    {borrow_id:1,user_id:1,book_id:3,borrow_date:iso(now-2*DAY),due_date:iso(now+5*DAY),return_date:null,status:'borrowed'},
    {borrow_id:2,user_id:1,book_id:7,borrow_date:iso(now-10*DAY),due_date:iso(now-3*DAY),return_date:null,status:'borrowed'},
    {borrow_id:3,user_id:1,book_id:5,borrow_date:iso(now-25*DAY),due_date:iso(now-18*DAY),return_date:iso(now-20*DAY),status:'returned'},
    {borrow_id:4,user_id:2,book_id:10,borrow_date:iso(now-4*DAY),due_date:iso(now+3*DAY),return_date:null,status:'borrowed'},
  ];
  borrowing.filter(b=>!b.return_date).forEach(b=>{ books.find(x=>x.book_id===b.book_id).status='borrowed'; });
  return {users,books,borrowing,seq:{book:books.length,borrow:4,user:9}};
}

let db = (()=>{ try{ const r=localStorage.getItem(KEY); return r?JSON.parse(r):seed(); }catch(e){ return seed(); } })();
const save = () => localStorage.setItem(KEY,JSON.stringify(db));
save();

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const getBook = id => db.books.find(b=>b.book_id===+id);
const getUser = id => db.users.find(u=>u.user_id===+id);
const activeLoan = bookId => db.borrowing.find(b=>b.book_id===+bookId && !b.return_date);
const isOverdue = l => !l.return_date && l.due_date < today();
const daysLeft = due => Math.ceil((new Date(due)-new Date(today()))/DAY);
const fmt = d => d ? new Date(d).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'}) : '—';
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const locText = l => `อาคาร ${l.building} • ชั้น ${l.floor} • ชั้นหนังสือ ${l.shelf} • ช่อง ${l.slot}`;

function toast(msg){
  const el=document.createElement('div'); el.className='toast'; el.textContent=msg;
  $('#toast').appendChild(el); setTimeout(()=>el.remove(),2600);
}
function statusBadge(book){
  if(book.status==='available') return '<span class="badge b-ok">● พร้อมให้ยืม</span>';
  const l=activeLoan(book.book_id);
  if(l && isOverdue(l)) return '<span class="badge b-late">● ถูกยืมอยู่ (เกินกำหนด)</span>';
  return '<span class="badge b-out">● ถูกยืมอยู่</span>';
}

/* =========================================================
   3) BUSINESS LOGIC — ยืม / คืน
   ========================================================= */
function borrowBook(bookId){
  const book=getBook(bookId); if(!book) return {ok:false,msg:'ไม่พบหนังสือเล่มนี้'};
  if(book.status!=='available') return {ok:false,msg:'หนังสือเล่มนี้ถูกยืมอยู่'};
  const mine=db.borrowing.filter(b=>b.user_id===S.user.user_id && !b.return_date);
  if(mine.length>=MAX_BOOKS) return {ok:false,msg:`ยืมได้สูงสุด ${MAX_BOOKS} เล่ม กรุณาคืนก่อน`};
  if(mine.some(isOverdue)) return {ok:false,msg:'มีหนังสือเกินกำหนดคืน กรุณาคืนก่อนยืมเล่มใหม่'};
  const due=iso(Date.now()+LOAN_DAYS*DAY);
  db.borrowing.push({borrow_id:++db.seq.borrow,user_id:S.user.user_id,book_id:book.book_id,
    borrow_date:today(),due_date:due,return_date:null,status:'borrowed'});
  book.status='borrowed'; save();
  return {ok:true,due,book};
}
function returnBook(bookId){
  const book=getBook(bookId);
  const loan=db.borrowing.find(b=>b.book_id===+bookId && !b.return_date && b.user_id===S.user.user_id);
  if(!loan) return {ok:false,msg:'หนังสือเล่มนี้ไม่ได้ถูกยืมโดยบัญชีของคุณ'};
  loan.return_date=today();
  loan.status = loan.due_date < today() ? 'returned_late' : 'returned';
  book.status='available'; save();
  return {ok:true,book,late:loan.status==='returned_late'};
}

/* =========================================================
   6) QR SCANNER (BarcodeDetector → fallback jsQR)
   ========================================================= */
let stream=null, rafId=null, detector=null, busy=false;
async function startScanner(){
  const video=$('#video'); if(!video) return;
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    video.srcObject=stream; await video.play();
    $('#scanEmpty').classList.add('hide');
    if('BarcodeDetector' in window){ detector=new window.BarcodeDetector({formats:['qr_code']}); }
    busy=false; loopScan();
    toast('เปิดกล้องแล้ว — เล็ง QR ให้อยู่ในกรอบ');
  }catch(e){
    $('#scanEmpty').classList.remove('hide');
    $('#scanEmpty').innerHTML='ไม่สามารถเปิดกล้องได้<br><span style="opacity:.7;font-size:13px">กรุณาอนุญาตสิทธิ์กล้อง หรือใช้การกรอกรหัสด้านล่าง</span>';
  }
}
async function loopScan(){
  const video=$('#video'), canvas=$('#canvas');
  if(!stream||!video||busy){ rafId=requestAnimationFrame(loopScan); return; }
  try{
    let code=null;
    if(detector){ const r=await detector.detect(video); if(r.length) code=r[0].rawValue; }
    else if(window.jsQR && video.videoWidth){
      canvas.width=video.videoWidth; canvas.height=video.videoHeight;
      const ctx=canvas.getContext('2d',{willReadFrequently:true});
      ctx.drawImage(video,0,0,canvas.width,canvas.height);
      const img=ctx.getImageData(0,0,canvas.width,canvas.height);
      const r=window.jsQR(img.data,img.width,img.height); if(r) code=r.data;
    }
    if(code){ busy=true; navigator.vibrate?.(60); scanResultModal(code); }
  }catch(e){}
  rafId=requestAnimationFrame(loopScan);
}
function stopScanner(){
  if(rafId) cancelAnimationFrame(rafId); rafId=null;
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  const v=$('#video'); if(v) v.srcObject=null;
  const e=$('#scanEmpty'); if(e){ e.classList.remove('hide'); e.textContent='กดปุ่ม “เปิดกล้อง” เพื่อเริ่มสแกน'; }
}

function render(){
  if(!S.user){ $('#root').innerHTML=loginView(); bindForms(); return; }
  const views={home:homeView,search:searchView,book:bookView,scan:scanView,
    mybooks:myBooksView,history:historyView,profile:profileView,admin:adminView};
  if(S.view==='admin' && S.user.role!=='admin') S.view='home';
  $('#root').innerHTML=shell((views[S.view]||homeView)());
  bindForms();
}
function bindForms(){
  $('#loginForm')?.addEventListener('submit',e=>{
    e.preventDefault();
    const id=$('#lg-id').value.trim(), pw=$('#lg-pw').value;
    const u=db.users.find(x=>x.student_id===id && x.password===pw);
    if(!u) return toast('รหัสผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
    S.user=u; sessionStorage.setItem('smartlib_user',JSON.stringify({user_id:u.user_id}));
    S.view=u.role==='admin'?'admin':'home'; render(); toast('ยินดีต้อนรับ '+u.name);
  });
  $('#heroSearch')?.addEventListener('submit',e=>{e.preventDefault();go('search',{q:$('#hero-q').value});});
  $('#searchForm')?.addEventListener('submit',e=>{e.preventDefault();go('search',{...S.params,q:$('#sq').value});});
  $('#f-cat')?.addEventListener('change',e=>go('search',{...S.params,cat:e.target.value}));
  $('#f-st')?.addEventListener('change',e=>go('search',{...S.params,status:e.target.value}));
  $('#adm-q')?.addEventListener('input',e=>{S.params.aq=e.target.value;const p=e.target.selectionStart;render();const f=$('#adm-q');f.focus();f.setSelectionRange(p,p);});
  $('#manualForm')?.addEventListener('submit',e=>{e.preventDefault();
    const c=$('#manual-code').value.trim(); if(c) scanResultModal(c);});
}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const a=el.dataset.act;
  switch(a){
    case 'go': go(el.dataset.view); break;
    case 'back': history.length?go(S.params.from||'search',{q:S.params.q}):go('home'); break;
    case 'open-book': go('book',{id:el.dataset.id,from:S.view,q:S.params.q}); break;
    case 'admin-login': $('#lg-id').value='admin'; $('#lg-pw').value='admin'; toast('กรอกบัญชีผู้ดูแลให้แล้ว กด “เข้าสู่ระบบ”'); break;
    case 'logout': stopScanner(); sessionStorage.removeItem('smartlib_user'); S.user=null; render(); break;
    case 'reset-db': if(confirm('รีเซ็ตข้อมูลกลับเป็นค่าตัวอย่าง?')){db=seed();save();toast('รีเซ็ตข้อมูลแล้ว');render();} break;
    case 'cam-start': startScanner(); break;
    case 'cam-stop': stopScanner(); toast('ปิดกล้องแล้ว'); break;
    case 'demo-scan': scanResultModal(el.dataset.code); break;
    case 'modal-close': closeModal(); busy=false; break;
    case 'modal-bg': if(e.target===el){closeModal();busy=false;} break;
    case 'do-borrow':{
      const r=borrowBook(el.dataset.id);
      if(!r.ok){ closeModal(); busy=false; return toast(r.msg); }
      openModal(`<div style="text-align:center">
        <div style="font-size:54px">✅</div><h3 style="margin:8px 0">ยืมหนังสือสำเร็จ</h3>
        <p style="font-size:15px;font-weight:600">${esc(r.book.title)}</p>
        <div style="background:#e8f0fe;color:#1657bd;border-radius:12px;padding:12px;margin-top:14px;font-size:15px">
          กำหนดคืนวันที่<br><b style="font-size:19px">${fmt(r.due)}</b></div>
        <p style="font-size:12.5px;color:var(--muted);margin-top:10px">กรุณาคืนภายในกำหนดเพื่อหลีกเลี่ยงค่าปรับ</p></div>
        <div class="modal-actions"><button class="btn" data-act="modal-close">ปิด</button>
          <button class="btn btn-primary" data-act="after-borrow">ดูหนังสือของฉัน</button></div>`);
      break;}
    case 'do-return':{
      const r=returnBook(el.dataset.id);
      if(!r.ok){ closeModal(); busy=false; return toast(r.msg); }
      openModal(`<div style="text-align:center">
        <div style="font-size:54px">✅</div><h3 style="margin:8px 0">คืนหนังสือสำเร็จ</h3>
        <p style="font-size:15px;font-weight:600">${esc(r.book.title)}</p>
        <p style="font-size:14px;color:var(--muted);margin-top:8px">สถานะหนังสือเปลี่ยนเป็น <span class="badge b-ok">พร้อมให้ยืม</span></p>
        ${r.late?'<p style="font-size:13px;color:var(--danger);margin-top:8px">คืนล่าช้า — โปรดติดต่อเคาน์เตอร์เรื่องค่าปรับ</p>':''}
        <p style="font-size:12.5px;color:var(--muted);margin-top:10px">กรุณาวางหนังสือคืนที่จุดรับคืน</p></div>
        <div class="modal-actions"><button class="btn" data-act="modal-close">ปิด</button>
          <button class="btn btn-primary" data-act="after-borrow">ดูหนังสือของฉัน</button></div>`);
      break;}
    case 'after-borrow': closeModal(); busy=false; go('mybooks'); break;
    case 'return-confirm':{
      const b=getBook(el.dataset.id), l=activeLoan(b.book_id);
      openModal(`<h3>ยืนยันการคืนหนังสือ</h3>
        <div style="display:flex;gap:14px;margin:12px 0">

          <div style="font-size:13px;color:var(--muted);margin-top:4px">กำหนดคืน ${fmt(l.due_date)}</div></div></div>
        <div class="modal-actions"><button class="btn" data-act="modal-close">ยกเลิก</button>
          <button class="btn btn-ok" data-act="do-return" data-id="${b.book_id}">ยืนยันการคืน</button></div>`);
      break;}
    /* ---- Admin ---- */
    case 'admin-tab': S.adminTab=el.dataset.tab; render(); break;
    case 'book-form': bookFormModal(el.dataset.id||null); break;
    case 'qr-show': qrModal(el.dataset.id); break;
    case 'book-del':{
      const b=getBook(el.dataset.id);
      if(activeLoan(b.book_id)) return toast('ลบไม่ได้ — หนังสือกำลังถูกยืมอยู่');
      if(confirm(`ลบ "${b.title}" ออกจากระบบ?`)){
        db.books=db.books.filter(x=>x.book_id!==b.book_id); save(); render(); toast('ลบหนังสือแล้ว');}
      break;}
    case 'book-save':{
      const v=k=>$('#bf-'+k).value.trim();
      if(!v('title')||!v('author')) return toast('กรุณากรอกชื่อหนังสือและผู้แต่ง');
      const loc={building:v('bd')||'A',floor:v('fl')||'1',shelf:v('sh')||'A',slot:v('sl')||'A-01'};
      const id=el.dataset.id;
      if(id){ const b=getBook(id);
        Object.assign(b,{title:v('title'),author:v('author'),category:v('category')||'ทั่วไป',
          isbn:v('isbn'),description:v('desc'),location:loc,qr_code:v('qr')||b.qr_code});
        b.image=cover(b.title,'#1f6feb'); toast('บันทึกการแก้ไขแล้ว');
      } else {
        const nid=++db.seq.book;
        db.books.push({book_id:nid,title:v('title'),author:v('author'),category:v('category')||'ทั่วไป',
          isbn:v('isbn'),description:v('desc'),location:loc,popular:0,
          qr_code:v('qr')||'SL-'+String(nid).padStart(4,'0'),status:'available',image:cover(v('title'),'#0f766e')});
        toast('เพิ่มหนังสือใหม่แล้ว');
      }
      save(); closeModal(); render(); break;}
    case 'admin-return':{
      const l=db.borrowing.find(x=>x.borrow_id===+el.dataset.bid);
      l.return_date=today(); l.status=l.due_date<today()?'returned_late':'returned';
      getBook(l.book_id).status='available'; save(); render(); toast('รับคืนหนังสือเรียบร้อย');
      break;}
  }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){closeModal();busy=false;} });
render();
</script>
</body>
</html>
